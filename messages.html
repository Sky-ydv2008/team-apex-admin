<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages — Apex Innovators Admin</title>
  <meta name="description" content="Apex Innovators admin inbox — read and manage contact-form messages.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2322d3ee'/%3E%3Cpath d='M13 2 3 14h9l-1 8 10-12h-9l1-8z' fill='%23050a14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="admin-body">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="main-content">
        <div class="admin-stack">
          <div class="toolbar">
            <div class="toolbar-left filter-row">
              <select class="input" id="filter-status" style="width:auto;" aria-label="Filter by status">
                <option value="">All messages</option>
                <option value="NEW">New</option>
                <option value="READ">Read</option>
                <option value="REPLIED">Replied</option>
              </select>
              <span class="muted" style="font-size:0.86rem;">Submitted through the public contact form.</span>
            </div>
          </div>

          <p class="results-meta" id="list-info" role="status"></p>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">From</th>
                    <th scope="col">Subject</th>
                    <th scope="col">Message</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="hide-md">Received</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
          <div id="table-pager"></div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="message-view-modal" class="modal" aria-labelledby="message-view-title">
    <div class="modal-box wide">
      <div class="modal-head">
        <h2 id="message-view-title">Message</h2>
        <button class="modal-close" type="button" data-dialog-close aria-label="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="message-view-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/admin/admin-messages.js"></script>
</body>
</html>
